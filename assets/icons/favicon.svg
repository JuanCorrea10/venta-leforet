<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-label="Hoja">
  <!--
    Hoja en forma de almendra con vena diagonal.
    Verde sage (#6f7558) representa la naturaleza y la vista
    a la cordillera (sector El Vergel).
    Esquema: dos curvas bezier que se encuentran en las puntas.
  -->
  <path d="M27 5 Q 5 5 5 27 Q 27 27 27 5 Z" fill="#6f7558"/>
  <path d="M5 27 L 27 5" stroke="#efeae0" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
</svg>
